# cargo-deny policy. Only the settings this project actually sets are kept;
# everything else stays at cargo-deny's own defaults, documented at
# https://embarkstudios.github.io/cargo-deny/checks/index.html
#
# `[sources]` is deliberately absent: `ci.sh` runs the licenses, advisories and
# bans checks only, so a sources policy here would be configured and never
# evaluated. Add the check first if that policy is ever wanted.

[licenses]
# A license that stops being needed fails the build rather than lingering here.
unused-allowed-license = "deny"
# GPL-3.0 compatible licenses actually used by dependencies.
allow = [
    "GPL-3.0-only",
    "MIT",
    "Apache-2.0",
    "Unlicense",
    "0BSD",
    "Zlib",
    "Unicode-3.0",
]

[bans]
multiple-versions = "deny"
# Highlight both the lowest-versioned and the shortest path to a duplicate.
highlight = "all"
skip = [
    { crate = "hashbrown@0.16.1", reason = "yaml-rust2's hashlink pins hashbrown 0.16 while deku's build-time toml_edit chain uses 0.17; drop once a yaml-rust2 release depends on hashlink >= 0.12, which moves to 0.17" },
]
