[package]
name = "dat3-core"
description = "Read and write Fallout and Troika DAT archives."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
# LGPL rather than the workspace's GPL, so programs under other licenses can use the library.
license = "LGPL-3.0-only"
publish.workspace = true

[features]
# Derives clap::ValueEnum on ArchiveFormat, so a CLI can take it as an argument.
clap = ["dep:clap"]
# Exposes the test_support module to other workspace crates' tests.
test-support = []

[dependencies]
anyhow.workspace = true
clap = { workspace = true, optional = true }

# Binary data handling
byteorder = "1.5"          # Read/write integers in different byte orders
# Declarative record layouts for DAT1, DAT2 and Arcanum; ToEE reads with byteorder. Kept rather than ported to
# byteorder or binrw: its one hazard, sizing a name buffer from an untrusted `count`, is closed by an assert on each
# length field, and a port would at most lift the clap cap (binrw is on syn 2 as well).
deku = "0.20"

# Compression and performance
# zlib-rs backend: measurably faster than the default miniz_oxide (level-9 archive
# creation -17%, extraction -11% on a 129 MB archive) and pure Rust, so the
# mingw/musl cross-builds need no C toolchain.
flate2 = { version = "1.1", features = ["zlib-rs"] } # zlib compression for DAT2 format
rayon = "1.8"              # Parallel processing for faster extraction

# Cross-platform path handling
glob = "0.3"               # Glob pattern matching for cross-platform support

[dev-dependencies]
proptest = "1.11.0"

[lints]
workspace = true
