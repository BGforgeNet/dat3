[package]
name = "fallout-dat3"
description = "Cross-platform CLI for Fallout and Troika DAT archives."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "dat3"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
dat3-core = { path = "../dat3-core", features = ["clap"] }

# Reads .bgforge.yml for the default-format setting. Default features off:
# they only add encoding_rs for non-UTF-8 input detection, which a config
# file doesn't need (and whose BSD-3-Clause part the license gate rejects).
yaml-rust2 = { version = "0.12", default-features = false }

# Optional: Use mimalloc on Linux for better performance
[target.'cfg(target_os = "linux")'.dependencies]
mimalloc = "0.1"

[dev-dependencies]
dat3-core = { path = "../dat3-core", features = ["clap", "test-support"] }

[lints]
workspace = true
