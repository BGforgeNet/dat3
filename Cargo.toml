[workspace]
members = ["crates/*"]
# dat3-wasm builds only for wasm32-unknown-unknown (a cdylib cannot link on the
# static musl target), so plain cargo commands leave it out; its gates name it.
default-members = ["crates/dat3", "crates/dat3-core"]
resolver = "3"

[workspace.package]
version = "0.10.1"
edition = "2024"
# Floor set by u32::is_multiple_of (stabilized 1.87); 1.85 fails to compile, 1.87 verified clean.
rust-version = "1.87"
authors = ["BGforge"]
license = "GPL-3.0-only"
# Consumed as a git dependency, never from crates.io.
publish = false

[workspace.dependencies]
# Error handling - makes error management much easier
anyhow = "1.0"

# Command-line interface
# <4.6.4: clap_derive 4.6.4 moved to syn 3 while deku's derive macros still use syn 2, and [bans] multiple-versions =
# "deny" forbids carrying both. Nothing in 4.6.x is needed; if a needed fix ships past the cap, skip syn 2 in
# deny.toml before porting off deku.
clap = { version = ">=4.4, <4.6.4", features = ["derive"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
# `expect` stays a warning: it is allowed on an invariant that cannot fail, with the message saying why.
unwrap_used = "deny"
expect_used = "warn"
unwrap_in_result = "warn"
undocumented_unsafe_blocks = "deny"
ptr_arg = "warn"
needless_range_loop = "warn"
wildcard_enum_match_arm = "warn"
from_over_into = "warn"
derive_partial_eq_without_eq = "warn"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.release.package."*"]
opt-level = 3
