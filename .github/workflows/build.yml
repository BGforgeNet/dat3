name: build

on:
  push:
  pull_request:

# Read-only by default; only the tag-gated release job elevates to
# contents:write, so ordinary push and PR runs carry no write-scoped token.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel tag (release) runs; superseded branch/PR runs are cancelled.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.98.1
  NODE_VERSION: "24.19.0"

# Jobs fan out so no single runner does everything in sequence: one build job per
# target, and the test jobs run against those builds' artifacts, so what is tested
# is exactly what ships. tests-complete fails a run in which some test.sh test
# ran in no job.
jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # persist-credentials: false - nothing here pushes, and leaving the token
      # in .git/config exposes it to every later step and to any artifact that
      # happens to include the checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # wasm32-unknown-unknown for clippy on dat3-wasm, which builds only for it
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-directories: ~/.cargo/bin

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Lint and unit tests
        run: ./ci.sh

  # The declared rust-version is a promise to users, and nothing checked it: the
  # build jobs pin a toolchain many releases newer, so code using a feature
  # stabilised after 1.87 would compile there and fail for anyone honouring
  # docs/building.md. The version is read from Cargo.toml rather than repeated here.
  msrv:
    name: msrv
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the declared MSRV
        id: msrv
        run: sed -n 's/^rust-version = "\(.*\)"/version=\1/p' Cargo.toml >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
          targets: wasm32-unknown-unknown

      # --locked so the committed lockfile is what gets checked, and --all-targets
      # so the test code is covered too.
      - name: Check against the declared MSRV
        run: cargo check --all-targets --locked

      # Not a default workspace member: it builds only for its wasm target
      - name: Check the wasm library against the declared MSRV
        run: cargo check -p dat3-wasm --target wasm32-unknown-unknown --locked

  # Its own job rather than a build matrix entry: most tests need only this
  # binary, and a job needing a matrix waits for every entry of it.
  build-linux:
    name: build (x86_64-unknown-linux-musl)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/build # zizmor: ignore[self-repository] actionlint 1.7.12 rejects $/
        with:
          targets: x86_64-unknown-linux-musl
          rust-targets: x86_64-unknown-linux-musl
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          apt-packages: musl-tools
          artifact: build-x86_64-unknown-linux-musl

  build:
    name: build (${{ matrix.targets }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          # zig, because mimalloc is C and apt has no aarch64-musl compiler, and
          # the macOS build needs a Mach-O linker; cargo-zigbuild drives it.
          - targets: aarch64-unknown-linux-musl
            rust-targets: aarch64-unknown-linux-musl
            tools: zig cargo-zigbuild
            artifact: build-aarch64-unknown-linux-musl
          - targets: universal2-apple-darwin
            rust-targets: x86_64-apple-darwin, aarch64-apple-darwin
            tools: zig cargo-zigbuild
            artifact: build-universal2-apple-darwin
          - targets: x86_64-pc-windows-gnu
            rust-targets: x86_64-pc-windows-gnu
            apt-packages: gcc-mingw-w64
            artifact: build-x86_64-pc-windows-gnu
          - targets: i686-pc-windows-gnu
            rust-targets: i686-pc-windows-gnu
            apt-packages: gcc-mingw-w64
            artifact: build-i686-pc-windows-gnu
          # wasm-bindgen and npm for the npm package
          - targets: wasm32-wasip1 npm
            rust-targets: wasm32-wasip1, wasm32-unknown-unknown
            tools: wasm-bindgen
            node: true
            artifact: build-wasm32-wasip1-npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/build # zizmor: ignore[self-repository] actionlint 1.7.12 rejects $/
        with:
          targets: ${{ matrix.targets }}
          rust-targets: ${{ matrix.rust-targets }}
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          apt-packages: ${{ matrix.apt-packages }}
          tools: ${{ matrix.tools }}
          node-version: ${{ matrix.node && env.NODE_VERSION || '' }}
          artifact: ${{ matrix.artifact }}

  # The test.sh tests needing only the native binary. The only job that saves the
  # fixture cache, since its tests fetch every fixture.
  test-native:
    name: test (native)
    needs: build-linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/test # zizmor: ignore[self-repository] actionlint 1.7.12 rejects $/
        with:
          artifacts: build-x86_64-unknown-linux-musl
          tests: >-
            non-ascii.sh rpu.sh arcanum.sh toee.sh f1.sh broken_pipe.sh response_file.sh add_validation.sh
            duplicate_paths.sh path_consistency.sh glob_handling.sh extract_missing.sh default_format.sh
            case_handling.sh readme_help.sh json_listing.ts toee-demo.sh
          node-version: ${{ env.NODE_VERSION }}
          save-fixtures: "true"
          id: native

  # The cross-checks against the original Windows tools that need only the native
  # binary. Each large extraction under wine takes about half a minute, so they
  # are spread across jobs.
  test-wine:
    name: test (${{ matrix.tests }})
    needs: build-linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      matrix:
        tests:
          - rpu_wine.sh
          - arcanum_wine.sh arcanum_demo_wine.sh f1_wine.sh
          - arcanum_demo_mod_wine.sh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/test # zizmor: ignore[self-repository] actionlint 1.7.12 rejects $/
        with:
          artifacts: build-x86_64-unknown-linux-musl
          tests: ${{ matrix.tests }}
          node-version: ${{ env.NODE_VERSION }}
          wine: "true"
          id: wine-${{ strategy.job-index }}

  # The tests of the other builds, each checked against the native one
  test-targets:
    name: test (other targets)
    needs: [build-linux, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/test # zizmor: ignore[self-repository] actionlint 1.7.12 rejects $/
        with:
          artifacts: build-*
          tests: wasm_library.sh wasm.sh arm64.sh glob_handling_wine.sh
          node-version: ${{ env.NODE_VERSION }}
          apt-packages: qemu-user-static
          tools: wasmtime
          wine: "true"
          # wasm_library.sh typechecks the docs/api.md example with the repository's TypeScript
          npm-ci: "true"
          id: targets

  tests-complete:
    name: tests complete
    needs: [test-native, test-wine, test-targets]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the tests that passed
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: tests-ran-*
          path: tests-ran
          merge-multiple: true

      - name: Check every test ran
        run: diff <(./test.sh --list | sort) <(sort -u tests-ran/*)

  assets:
    name: assets
    needs: [build-linux, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Download builds
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: build-*
          path: ${{ runner.temp }}/builds

      - name: Unpack builds
        run: find "$RUNNER_TEMP/builds" -name build.tar -exec tar -xf {} \;

      - name: Prepare release assets
        run: |
          cp target/x86_64-unknown-linux-musl/release/dat3 dat3
          cp target/aarch64-unknown-linux-musl/release/dat3 dat3-arm64
          cp target/universal2-apple-darwin/release/dat3 dat3-macos
          cp target/x86_64-pc-windows-gnu/release/dat3.exe dat3.exe
          cp target/i686-pc-windows-gnu/release/dat3.exe dat3-win32.exe
          cp target/wasm32-wasip1/release/dat3.wasm dat3.wasm
          cp target/dat3-wasm.tgz dat3-wasm.tgz

      # Always uploaded, tags included: the release job downloads these rather
      # than rebuilding, which is what lets it run without a checkout or a
      # toolchain and hold contents:write for nothing else.
      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dat3
          path: |
            dat3
            dat3-arm64
            dat3-macos
            dat3.exe
            dat3-win32.exe
            dat3.wasm
            dat3-wasm.tgz
          if-no-files-found: error

  # The macOS binary is cross-built on Linux, where nothing can run it. One
  # runner per architecture, so each slice of the universal binary is run.
  macos:
    name: macos (${{ matrix.runner }})
    needs: assets
    strategy:
      matrix:
        runner: [macos-26, macos-26-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dat3
          path: assets

      # Artifacts do not keep the executable bit
      - name: Test the macOS binary
        env:
          MACOS_DAT3: assets/dat3-macos
        run: chmod +x "$MACOS_DAT3" && ./tests/macos.sh

  # Separate job so contents:write exists only on a tag run, and only for the
  # step that publishes. It builds nothing: the binaries come from the assets
  # job's artifact.
  release:
    name: release
    needs: [lint, assets, tests-complete, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dat3
          path: assets

      # The project verifies every tool it downloads by sha256; releases carry
      # the same so consumers can do likewise.
      - name: Checksum the assets
        run: cd assets && sha256sum -- * > SHA256SUMS

      - name: Release with assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref }}
          name: ${{ github.ref_name }}
          files: |
            assets/dat3
            assets/dat3-arm64
            assets/dat3-macos
            assets/dat3.exe
            assets/dat3-win32.exe
            assets/dat3.wasm
            assets/dat3-wasm.tgz
            assets/SHA256SUMS
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
