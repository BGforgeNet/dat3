name: build

on:
  push:
  pull_request:

# The release step needs contents:write; everything else in the token stays off.
permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel tag (release) runs; superseded branch/PR runs are cancelled.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-musl, x86_64-pc-windows-gnu, i686-pc-windows-gnu

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-directories: ~/.cargo/bin

      - name: Shellcheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: "."

      - name: Pre-test
        run: ./ci.sh

      - name: Install wine
        uses: devopsx/gha-ubuntu-i386-fix@857a708773e426df64597ec43c9cd3d5bb85abee # master (no tagged releases)

      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64 musl-tools p7zip-full

      - name: Cache test fixtures
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            tests/rpu_v2.4.33.zip
            tests/ArcanumDemo.dat
          key: test-fixtures-rpu-v2.4.33-arcanum-demo-v1

      - name: Build binaries
        run: ./build.sh

      - name: Test
        run: ./test.sh

      - name: Prepare release assets
        run: |
          cp target/x86_64-unknown-linux-musl/release/dat3 dat3
          cp target/x86_64-pc-windows-gnu/release/dat3.exe dat3.exe
          cp target/i686-pc-windows-gnu/release/dat3.exe dat3-win32.exe

      - name: Prepare debug assets
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          cp target/x86_64-unknown-linux-musl/debug/dat3 dat3-debug
          cp target/x86_64-pc-windows-gnu/debug/dat3.exe dat3-debug.exe
          cp target/i686-pc-windows-gnu/debug/dat3.exe dat3-win32-debug.exe

      - name: Upload release artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dat3
          path: |
            dat3
            dat3.exe
            dat3-win32.exe
          if-no-files-found: error

      - name: Upload debug artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dat3-debug
          path: |
            dat3-debug
            dat3-debug.exe
            dat3-win32-debug.exe
          if-no-files-found: error

      - name: Release with assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref }}
          name: ${{ github.ref_name }}
          files: |
            dat3
            dat3.exe
            dat3-win32.exe
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
