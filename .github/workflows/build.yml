name: build

on:
  push:
  pull_request:

# The release step needs contents:write; everything else in the token stays off.
permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel tag (release) runs; superseded branch/PR runs are cancelled.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-musl, aarch64-unknown-linux-musl, x86_64-pc-windows-gnu, i686-pc-windows-gnu, wasm32-wasip1

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-directories: ~/.cargo/bin

      - name: Shellcheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: "."

      - name: Pre-test
        run: ./ci.sh

      - name: Install wine
        uses: devopsx/gha-ubuntu-i386-fix@857a708773e426df64597ec43c9cd3d5bb85abee # master (no tagged releases)

      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64 musl-tools p7zip-full qemu-user-static

      # mimalloc is C and apt has no aarch64-musl compiler; zig supplies one.
      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Install cargo-zigbuild
        run: |
          if ! command -v cargo-zigbuild &>/dev/null; then
            cargo binstall -y cargo-zigbuild@0.23.0
          fi

      # Runs the WebAssembly build in tests/wasm.sh. 47.0.4 rather than the
      # older 47.0.3: it fixes a sandbox escape (GHSA-vqjp-4c8c-hfgg).
      - name: Install wasmtime
        run: |
          if ! command -v wasmtime &>/dev/null; then
            cargo binstall -y wasmtime-cli@47.0.4
          fi

      - name: Cache test fixtures
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            tests/rpu_v2.4.33.zip
            tests/ArcanumDemo.dat
          key: test-fixtures-rpu-v2.4.33-arcanum-demo-v1

      - name: Build binaries
        run: ./build.sh

      - name: Test
        run: ./test.sh

      - name: Prepare release assets
        run: |
          cp target/x86_64-unknown-linux-musl/release/dat3 dat3
          cp target/aarch64-unknown-linux-musl/release/dat3 dat3-arm64
          cp target/x86_64-pc-windows-gnu/release/dat3.exe dat3.exe
          cp target/i686-pc-windows-gnu/release/dat3.exe dat3-win32.exe
          cp target/wasm32-wasip1/release/dat3.wasm dat3.wasm

      - name: Prepare debug assets
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          cp target/x86_64-unknown-linux-musl/debug/dat3 dat3-debug
          cp target/aarch64-unknown-linux-musl/debug/dat3 dat3-arm64-debug
          cp target/x86_64-pc-windows-gnu/debug/dat3.exe dat3-debug.exe
          cp target/i686-pc-windows-gnu/debug/dat3.exe dat3-win32-debug.exe
          cp target/wasm32-wasip1/debug/dat3.wasm dat3-debug.wasm

      - name: Upload release artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dat3
          path: |
            dat3
            dat3-arm64
            dat3.exe
            dat3-win32.exe
            dat3.wasm
          if-no-files-found: error

      - name: Upload debug artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dat3-debug
          path: |
            dat3-debug
            dat3-arm64-debug
            dat3-debug.exe
            dat3-win32-debug.exe
            dat3-debug.wasm
          if-no-files-found: error

      - name: Release with assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.ref }}
          name: ${{ github.ref_name }}
          files: |
            dat3
            dat3-arm64
            dat3.exe
            dat3-win32.exe
            dat3.wasm
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
