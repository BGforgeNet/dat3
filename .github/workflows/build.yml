name: build

on:
  push:
  pull_request:

# Read-only by default; only the tag-gated release job elevates to
# contents:write, so ordinary push and PR runs carry no write-scoped token.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel tag (release) runs; superseded branch/PR runs are cancelled.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # persist-credentials: false - nothing here pushes, and leaving the token
      # in .git/config exposes it to every later step and to any artifact that
      # happens to include the checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-musl, aarch64-unknown-linux-musl, x86_64-pc-windows-gnu, i686-pc-windows-gnu, wasm32-wasip1

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-directories: ~/.cargo/bin
          # The cache is only written on a key miss, so without this it would
          # keep serving a target/ dir built before build.sh's target list grew.
          key: ${{ hashFiles('build.sh') }}

      - name: Shellcheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: "."

      # tests/json_listing.ts runs through Node's own type stripping rather than
      # a build step, so the Node version is what decides whether it runs at
      # all. Pinned so the runner image's default cannot change that silently.
      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          cache: npm

      - name: Pre-test
        run: ./ci.sh

      - name: Install wine
        uses: devopsx/gha-ubuntu-i386-fix@857a708773e426df64597ec43c9cd3d5bb85abee # master (no tagged releases)

      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64 musl-tools p7zip-full qemu-user-static

      # zig, because mimalloc is C and apt has no aarch64-musl compiler, plus
      # cargo-zigbuild for that cross-build and wasmtime for tests/wasm.sh.
      # Versions and digests live in the script; ci.sh has already installed the
      # gate tools it shares with this step.
      - name: Install build tools
        run: ./install-tools.sh

      - name: Cache test fixtures
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            tests/rpu_v2.4.33.zip
            tests/ArcanumDemo.dat
            tests/FalloutDemo.dat
          key: test-fixtures-rpu-v2.4.33-arcanum-demo-fallout-demo-v1

      - name: Build binaries
        run: ./build.sh

      - name: Test
        run: ./test.sh

      - name: Prepare release assets
        run: |
          cp target/x86_64-unknown-linux-musl/release/dat3 dat3
          cp target/aarch64-unknown-linux-musl/release/dat3 dat3-arm64
          cp target/x86_64-pc-windows-gnu/release/dat3.exe dat3.exe
          cp target/i686-pc-windows-gnu/release/dat3.exe dat3-win32.exe
          cp target/wasm32-wasip1/release/dat3.wasm dat3.wasm

      - name: Prepare debug assets
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          cp target/x86_64-unknown-linux-musl/debug/dat3 dat3-debug
          cp target/aarch64-unknown-linux-musl/debug/dat3 dat3-arm64-debug
          cp target/x86_64-pc-windows-gnu/debug/dat3.exe dat3-debug.exe
          cp target/i686-pc-windows-gnu/debug/dat3.exe dat3-win32-debug.exe
          cp target/wasm32-wasip1/debug/dat3.wasm dat3-debug.wasm

      # Always uploaded, tags included: the release job downloads these rather
      # than rebuilding, which is what lets it run without a checkout or a
      # toolchain and hold contents:write for nothing else.
      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dat3
          path: |
            dat3
            dat3-arm64
            dat3.exe
            dat3-win32.exe
            dat3.wasm
          if-no-files-found: error

      - name: Upload debug artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dat3-debug
          path: |
            dat3-debug
            dat3-arm64-debug
            dat3-debug.exe
            dat3-win32-debug.exe
            dat3-debug.wasm
          if-no-files-found: error

  # The declared rust-version is a promise to users, and nothing checked it: the
  # build job pins a toolchain many releases newer, so code using a feature
  # stabilised after 1.87 would compile there and fail for anyone honouring the
  # README. The version is read from Cargo.toml rather than repeated here.
  msrv:
    name: msrv
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the declared MSRV
        id: msrv
        run: sed -n 's/^rust-version = "\(.*\)"/version=\1/p' Cargo.toml >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      # --locked so the committed lockfile is what gets checked, and --all-targets
      # so the test code is covered too.
      - name: Check against the declared MSRV
        run: cargo check --all-targets --locked

  # Separate job so contents:write exists only on a tag run, and only for the
  # step that publishes. It builds nothing: the binaries come from the build
  # job's artifact.
  release:
    name: release
    needs: ci
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dat3
          path: assets

      # The project verifies every tool it downloads by sha256; releases carry
      # the same so consumers can do likewise.
      - name: Checksum the assets
        run: cd assets && sha256sum -- * > SHA256SUMS

      - name: Release with assets
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.ref }}
          name: ${{ github.ref_name }}
          files: |
            assets/dat3
            assets/dat3-arm64
            assets/dat3.exe
            assets/dat3-win32.exe
            assets/dat3.wasm
            assets/SHA256SUMS
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
